function reports(){const since=new Date(TODAY);since.setDate(since.getDate()-30);const recent=state.sales.filter(s=>new Date(s.date)>=since),rev=revenue(recent),cost=recent.reduce((s,x)=>s+x.lines.reduce((sum,l)=>sum+l.qty*Number(l.cost||0),0),0),units=recent.reduce((s,x)=>s+qtyOf(x),0);const counts=new Map();recent.forEach(s=>s.lines.forEach(l=>{const o=counts.get(l.id)||{units:0,sales:0};o.units+=l.qty;o.sales+=l.qty*l.price;counts.set(l.id,o)}));const ranked=[...counts].sort((a,b)=>b[1].units-a[1].units),max=Math.max(1,...ranked.map(x=>x[1].units));return `${head('Understand the numbers','Sales reports','A basic picture of recorded activity over the last 30 days.',`<button class="btn" data-action="export-sales">${ico('download')} Export sales CSV</button>`)}<div class="stat-grid">${stat('Revenue',fmt(rev),'From recorded sales','wallet')}${stat('Gross profit estimate',fmt(rev-cost),'Before operating expenses','chart-column')}${stat('Units sold',units,'Across all products','boxes')}${stat('Transactions',recent.length,'Recorded sales','file-text')}</div><div class="report-grid"><div class="panel"><div class="panel-head"><div><h2>Top moving products</h2><small>Ranked by quantity sold in the last 30 days</small></div></div><div class="panel-inner">${ranked.length?ranked.slice(0,7).map(([id,data])=>`<div class="metricline"><div style="flex:1"><div class="split-head"><b>${esc(product(id)?.name||'Deleted product')}</b><span>${data.units} units</span></div><div class="progress"><div style="width:${data.units/max*100}%"></div></div></div></div>`).join(''):'<div class="empty">Record sales to see top-moving items.</div>'}</div></div><div class="panel"><div class="panel-head"><div><h2>Things to know</h2><small>What the numbers mean</small></div></div><div class="panel-inner"><div class="info-card"><b>Revenue</b> is based on sales entered here, not bank deposits.<br><br><b>Gross profit estimate</b> uses each item's recorded cost at the time of sale; it does not include staffing, rent, shipping, taxes, or other expenses.<br><br><b>Inventory value</b> uses unit costs stored against products.<br><br><b>Tax</b> is a basic configurable percentage, not a tax-compliance engine.</div></div></div></div><div class="panel section-space"><div class="panel-head"><div><h2>Recorded transactions</h2></div></div>${saleTable(recent.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)))}</div>`}

function saveProduct(id){const form=$('#product-form');if(!form.reportValidity())return;const f=k=>form.querySelector('#p-'+k).value.trim();const qty=k=>Number(f(k));const name=f('name'),sku=f('sku'),category=f('category'),stock=qty('stock'),lowLevel=qty('low'),price=qty('price'),cost=qty('cost');if(![stock,lowLevel,price,cost].every(Number.isFinite)||![stock,lowLevel].every(Number.isInteger)||[stock,lowLevel,price,cost].some(x=>x<0)){showToast('Enter valid nonnegative stock, threshold, and prices.');return;}if(state.products.some(p=>p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==id)){showToast('Another product already uses that SKU.');return;}if(id){Object.assign(product(id),{name,sku,category,stock,low:lowLevel,price,cost})}else{state.products.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,sku,category,stock,low:lowLevel,price,cost})}save();closeModal();render();showToast(id?'Product updated.':'Product added.');}
function updateDraft(kind,index,key,value){const arr=kind==='quote'?quoteDraft:salesDraft;if(!arr[index])return;if(key==='id')arr[index].id=value;if(key==='qty'){const q=Number(value);arr[index].qty=Number.isFinite(q)?q:0}updateDraftTotals(kind)}
function updateDraftTotals(kind){const arr=kind==='quote'?quoteDraft:salesDraft;const prefix=kind==='quote'?'quote':'sale';arr.forEach((r,i)=>{const node=$(`#${prefix}-lines [data-line-index="${i}"] .line-price`);if(node){const p=product(r.id);node.textContent=p?fmt(p.price*(r.qty||0)):'—'}});const total=draftTotal(arr),tax=total*(Number(state.settings.tax)||0)/100;const sub=$(`#${prefix}-subtotal`),taxEl=$(`#${prefix}-tax`),grandEl=$(`#${prefix}-total`);if(sub)sub.textContent=fmt(total);if(taxEl)taxEl.textContent=fmt(tax);if(grandEl)grandEl.textContent=fmt(total+tax)}
function validateLines(lines,checkStock=true){if(!lines.length||lines.some(x=>!product(x.id)||!Number.isInteger(x.qty)||x.qty<1))return 'Choose products and whole-number quantities greater than zero.';const totals=new Map();for(const row of lines)totals.set(row.id,(totals.get(row.id)||0)+row.qty);if(checkStock)for(const [id,qty] of totals){const p=product(id);if(qty>p.stock)return `Not enough stock: ${p.name}. Available ${p.stock}, requested ${qty}.`;}return ''}
function toRecordedLines(rows){return rows.map(r=>{const p=product(r.id);return{id:r.id,name:p.name,sku:p.sku,qty:r.qty,price:p.price,cost:p.cost}})}
function recordSale(lines,customer,quoteId){const error=validateLines(lines,true);if(error){showToast(error);return false}const recorded=toRecordedLines(lines);for(const row of lines){product(row.id).stock-=row.qty;}const id='S-'+state.sequence++;state.sales.push({id,date:new Date().toISOString(),customer:customer||'Walk-in customer',lines:recorded,tax:Number(state.settings.tax)||0});if(quoteId){const q=state.quotes.find(q=>q.id===quoteId);if(q){q.status='converted';q.saleId=id}}save();showToast(`Sale ${id} recorded. Stock updated and invoice created.`);switchView('documents');return true}
function quoteSave(){const error=validateLines(quoteDraft,false);if(error)return showToast(error);const customer=quoteCustomer.trim()||'Customer';const id='Q-'+state.quoteSequence++;state.quotes.push({id,date:new Date().toISOString(),customer,lines:toRecordedLines(quoteDraft),tax:Number(state.settings.tax)||0,status:'open'});save();quoteDraft=[{id:state.products[0]?.id||'',qty:1}];quoteCustomer='';render();showToast(`Quote ${id} saved. Inventory was not changed.`)}
function convertQuote(id){const q=state.quotes.find(x=>x.id===id);if(!q||q.status!=='open')return;const rows=q.lines.map(l=>({id:l.id,qty:l.qty}));const err=validateLines(rows,true);if(err){showToast(err);return}modal('Convert quote to sale',`<p class="helper">Record <b>${esc(q.id)}</b> for <b>${esc(q.customer)}</b> as a sale for ${fmt(grand(q))}? This will deduct the quantities listed from current inventory and create an invoice.</p><div class="notice">Prices or taxes may have changed since the quote was saved. The invoice will use current product prices and tax settings.</div>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn coral" data-action="confirm-convert" data-id="${esc(id)}">Record sale</button>`)}
function printDoc(type,id){const doc=type==='quote'?state.quotes.find(x=>x.id===id):state.sales.find(x=>x.id===id);if(!doc)return;const isQuote=type==='quote';const total=grand(doc);$('#print-area').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:start;border-bottom:3px solid #ea705e;padding-bottom:22px"><div><div style="font-size:13px;letter-spacing:3px;font-weight:bold;color:#ea705e">SZARA COUNTER</div><h1 style="margin:12px 0 5px">${esc(state.settings.business)}</h1><div style="color:#666">Generated from local demonstration workspace</div></div><div style="text-align:right"><h1>${isQuote?'QUOTATION':'INVOICE'}</h1><b>${esc(doc.id)}</b><div style="margin-top:8px">${date(doc.date)}</div></div></div><p style="margin-top:35px"><b>Customer</b><br>${esc(doc.customer)}</p><table><thead><tr><th>Product</th><th>SKU</th><th class="right">Qty</th><th class="right">Unit price</th><th class="right">Amount</th></tr></thead><tbody>${doc.lines.map(l=>`<tr><td>${esc(l.name||product(l.id)?.name||'Product')}</td><td>${esc(l.sku||product(l.id)?.sku||'')}</td><td class="right">${l.qty}</td><td class="right">${fmt(l.price)}</td><td class="right">${fmt(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><div style="width:300px;margin:30px 0 0 auto"><div style="display:flex;justify-content:space-between;padding:7px"><span>Subtotal</span><b>${fmt(subtotal(doc.lines))}</b></div><div style="display:flex;justify-content:space-between;padding:7px"><span>Tax (${doc.tax||0}%)</span><b>${fmt(subtotal(doc.lines)*(doc.tax||0)/100)}</b></div><div style="display:flex;justify-content:space-between;padding:12px 7px;border-top:2px solid #18212e;font-size:20px"><b>Total</b><b>${fmt(total)}</b></div></div><p style="margin-top:70px;color:#677384;font-size:11px">${isQuote?'Quotation only. Items are not reserved or deducted from stock.':'Demo invoice generated from a recorded sale.'} Not a tax-compliant production invoicing service.</p>`;window.print();}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const csvCell=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
function exportCSV(kind){let rows;if(kind==='inventory'){rows=[['SKU','Name','Category','On hand','Low stock alert','Sell price','Unit cost'],...state.products.map(p=>[p.sku,p.name,p.category,p.stock,p.low,p.price,p.cost])]}else{rows=[['Invoice','Date','Customer','SKU','Product','Qty','Unit price','Total line price','Transaction tax %'],...state.sales.flatMap(s=>s.lines.map(l=>[s.id,s.date,s.customer,l.sku||product(l.id)?.sku||'',l.name||product(l.id)?.name||'',l.qty,l.price,l.qty*l.price,s.tax]))]}download(`szara-${kind}-${new Date().toISOString().slice(0,10)}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function reset(){modal('Reset local demo?',`<p>This will erase your local demo changes and restore the original sample store, products, and transactions on this browser. Download a JSON backup first if you want to keep them.</p>`,`<button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="confirm-reset">Reset data</button>`)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){switchView(nav.dataset.view);return}const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id,kind=el.dataset.kind;switch(action){case'add-product':openProduct();break;case'edit-product':openProduct(id);break;case'save-product':saveProduct(id);break;case'close-modal':closeModal();break;case'add-line':{const arr=kind==='quote'?quoteDraft:salesDraft;arr.push({id:'',qty:1});render();break}case'record-sale':{const customer=salesCustomer.trim()||'Walk-in customer';if(recordSale(salesDraft,customer)){salesCustomer='';salesDraft=[{id:state.products[0]?.id||'',qty:1}]} break}case'save-quote':quoteSave();break;case'convert-quote':convertQuote(id);break;case'confirm-convert':{const q=state.quotes.find(x=>x.id===id);closeModal();if(q)recordSale(q.lines.map(x=>({id:x.id,qty:x.qty})),q.customer,q.id);break}case'print-doc':printDoc(el.dataset.type,id);break;case'export-inventory':exportCSV('inventory');break;case'export-sales':exportCSV('sales');break;case'download-backup':download('szara-counter-demo-backup.json',JSON.stringify(state,null,2),'application/json');break;case'reset-demo':reset();break;case'confirm-reset':state=defaults();inventorySearch='';salesCustomer='';quoteCustomer='';salesDraft=[{id:'p1',qty:1}];quoteDraft=[{id:'p2',qty:1}];save();closeModal();switchView('dashboard');showToast('Demo restored to sample data.');break;default:break;}});
document.addEventListener('click',e=>{const el=e.target.closest('.line-remove');if(!el)return;const arr=el.dataset.kind==='quote'?quoteDraft:salesDraft;arr.splice(Number(el.dataset.index),1);render()});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('.line-product'))updateDraft(el.dataset.kind,Number(el.dataset.index),'id',el.value);if(el.matches('.line-qty'))updateDraft(el.dataset.kind,Number(el.dataset.index),'qty',el.value)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='sale-customer')salesCustomer=el.value;if(el.id==='quote-customer')quoteCustomer=el.value;if(el.id==='inventory-search'){const start=el.selectionStart;inventorySearch=el.value;const tbody=$('.data-table tbody');if(tbody){const filtered=state.products.filter(p=>[p.name,p.sku,p.category].some(x=>x.toLowerCase().includes(inventorySearch.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));tbody.innerHTML=filtered.length?filtered.map(p=>`<tr><td><div class="item-name">${esc(p.name)}</div><div class="item-sub">${esc(p.sku)}</div></td><td>${esc(p.category)}</td><td><b>${p.stock}</b></td><td>${p.low}</td><td>${fmt(p.price)}</td><td>${status(p)}</td><td><button class="btn small" data-action="edit-product" data-id="${esc(p.id)}">Edit</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No matching products.</td></tr>'}el.setSelectionRange(start,start)}if(el.matches('.line-qty'))updateDraft(el.dataset.kind,Number(el.dataset.index),'qty',el.value)});
document.addEventListener('submit',e=>{if(e.target.id!=='settings-form')return;e.preventDefault();const business=$('#setting-business').value.trim(),currency=$('#setting-currency').value,tax=Number($('#setting-tax').value);if(!business||!['USD','TTD'].includes(currency)||!Number.isFinite(tax)||tax<0||tax>100){showToast('Check the business name, currency and tax rate.');return}state.settings={business,currency,tax};save();render();showToast('Settings saved for this browser.')});
$('#modal-close').addEventListener('click',closeModal);$('#modal-wrap').addEventListener('click',e=>{if(e.target===$('#modal-wrap'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#mobile-menu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#nav-dimmer').classList.add('open')});$('#nav-dimmer').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#nav-dimmer').classList.remove('open')});render();
})();
</script>
</body>
</html>
